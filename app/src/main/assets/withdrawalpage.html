<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments</title>
    <link rel="stylesheet" href="paymentpage.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <!-- Google Montserrat Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- Header Section -->
<header class="header">
    <button class="back-button" onclick="goBack()"><i class="ri-arrow-left-line"></i></button>
    <span>Withdraw</span>
</header>

<!-- Top Section -->
<div class="top-section">
    <h2>Amount to withdraw</h2>
    <h1 id="withdraw-amount">₹ 0</h1>
    <div class="refer-text">Refer & earn more</div>
    <button class="withdraw-button">Withdraw</button>
    <p class="info-text">Amount will be automatically sent in 2-3 working days.</p>
</div>

<!-- Recent Payments Section -->
<div class="recent-payments">
    <h3>Recent Payments</h3>
    <div id="payments-list" class="payments-container">
        <!-- Cards will be dynamically inserted here -->
    </div>
</div>


<script src="withdrawaL.js" defer></script>
</body>
</html>
