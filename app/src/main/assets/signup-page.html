<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedKado Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup-page.css">
</head>
<body>
<div class="Signup-container">
    <div class="logo">
        <img src="./MEDKADO_Logo.png" alt="MedKado Logo" class="logo-image">
        <h1>MedKado</h1>
    </div>
    <h2>Sign Up</h2>
    <p class="subtitle">My card, My Health</p>
    <form id="Signup-form">
        <div class="form-group">
            <label for="username">Email ID</label>
            <input type="text" id="username" placeholder="Enter your email ID" required>
            <small class="error-message" id="username-error">Email ID is required</small>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" placeholder="Enter your password" required>
                <button type="button" class="toggle-password" id="toggle-password">Show</button>
            </div>
            <small class="error-message" id="password-error">Password is required</small>
        </div>
        <div class="form-group">
            <label for="referral">Referral Code <span class="optional">(optional)</span></label>
            <input type="text" id="referral" placeholder="Enter referral code">
        </div>
        <div class="form-group">
            <label>Mobile no.</label>
            <input type="number" id="mobile_num" placeholder="Enter mobile number" minlength="10" maxlength="10" required>
        </div>
        <div class="form-group">
            <label for="country">District</label>
            <select id="country" name="country">
                <option value="" disabled selected>Select District</option>
            </select>        
        </div>
        <div id="toast" class="toast">Signup Successful!</div>
        <button type="submit" class="Signup-btn" id="Signup-button">
            <span class="button-text">SIGN UP</span>
            <span class="loader" style="display: none;"></span>
        </button>
        <div class="alreadyExist">
            <p class="alreadyExistp">already have an account?</p>
            <a href="login-page.html">Login</a>
        </div>
    </form>
</div>
<script src="signupscript.js"></script>
</body>
</html>
