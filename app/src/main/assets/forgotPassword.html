<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot_password.css">
</head>
<body>
<div class="Signup-container">
    <div class="forgot-password-container">
        <button class="back-btn">Back to login</button>
        <span class="forgot-password-text">Forgot Password?</span>
    </div>


    <form id="forgotPasswordForm">
        <p class="subtitle">Please enter the last 4 digits of your mobile number and your birth date to reset your password.</p>

        <div class="form-group">
            <label for="mobileDigits">Last 4 Digits of Mobile Number</label>
            <input type="text" id="mobileDigits" maxlength="4" placeholder="1234" required pattern="\d{4}">
            <div class="error-message" id="mobileError">Please enter the last 4 digits correctly.</div>
        </div>

        <div class="form-group">
            <label for="birthDate">Birth Date</label>
            <input type="date" id="birthDate" required>
            <div class="error-message" id="birthDateError">Please select a valid birth date.</div>
        </div>

        <button type="submit" class="Signup-btn" id="resetButton">Reset Password</button>
    </form>

    <p id="error-message" class="error-message hidden">Please fill all fields correctly.</p>
</div>

<script src="forgot_password.js"></script>
</body>
</html>
