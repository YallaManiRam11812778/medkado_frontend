<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot_password.css">
</head>
<body>
<div class="forgot-password-container">
    <button class="back-btn" onclick="goBack()">Back to Login</button>
    <h1>Forgot Password</h1>
    <p class="subtitle">Enter your registered Email ID and the last 4 digits of your phone number to reset your password.</p>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <label for="email">Email ID</label>
            <input type="email" id="email" placeholder="Enter your Email ID" required>
            <small class="error-message" id="emailError">Please enter a valid Email ID.</small>
        </div>

        <div class="form-group">
            <label for="phoneDigits">Last 4 Digits of Phone</label>
            <input type="text" id="phoneDigits" placeholder="Enter last 4 digits of your phone" maxlength="4" required>
            <small class="error-message" id="phoneDigitsError">Please enter valid 4 digits.</small>
        </div>

        <!-- Change Password Section, Hidden Initially -->
        <div id="changePasswordSection" class="hidden">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter your new password" required>
                <small class="error-message" id="passwordError">Password must be at least 6 characters long.</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your new password" required>
                <small class="error-message" id="confirmPasswordError">Passwords do not match.</small>
            </div>
        </div>

        <button type="submit" class="reset-btn">Submit</button>
        <div class="success-message" id="successMessage">
            Your password has been successfully updated.
        </div>
    </form>
</div>
<script src="forgot_password.js"></script>
</body>
</html>
