<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Page</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="referral.css">
</head>
<body>
<div class="container">
    <div class="top-section">
        <button id="backButton" class="back-button">
            <i class="ri-arrow-left-line"></i> Back
        </button>
        <p class="help-text">Share your referral code with friends to earn rewards!</p>
        <div class="referral-code-container">
            <span id="referralCode">Loading...</span>
            <button id="copyButton" disabled>Copy</button>
        </div>
    </div>

    <div class="bottom-section">
        <h2>People Referred</h2>
        <div id="referralCardsContainer">
            <!-- Cards will be dynamically populated -->
            <p>Loading...</p>
        </div>
    </div>
</div>

<script src="referral.js"></script>
</body>
</html>
