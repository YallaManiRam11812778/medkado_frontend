<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupon Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="MyProfile.css">
</head>
<body>
<header>
    <div class="header">
        <a href="account-page.html" class="back-button"><i class="ri-arrow-left-line"></i></a>
        <h1>My Profile</h1>
    </div>
</header>
<main>
    <!-- Your Plan Section -->
    <section class="your-plan">
        <h2>Your Plan</h2>
        <div class="plan-details">
            <!-- These elements will be dynamically updated by JavaScript -->
            <div class="plan-name">Plan Name: <span id="plan-name">Loading...</span></div>
            <div class="plan-duration">Plan Purchased: <span id="plan-duration">Loading...</span></div>
            <div class="plan-start">Plan Expiry Date: <span id="plan-start">Loading...</span></div>
        </div>
    </section>

    <!-- Your Family Section -->
    <section class="your-family">
        <h2>Your Family</h2>
        <ul id="profile-list" class="profile-list"></ul>
    </section>
</main>
<script src="MyProfile.js"></script>
</body>
</html>
